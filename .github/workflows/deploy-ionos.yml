name: Publicar SHOW OS CAMPUS en IONOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ionos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: show-os-ionos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar cliente SFTP
        run: npm install --no-save --package-lock=false --no-audit --no-fund ssh2-sftp-client@12.1.1

      - name: Publicar index.html con verificación de servidor
        id: deploy
        env:
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR }}
        run: node scripts/deploy-ionos.cjs

      - name: Guardar copia del index.html anterior
        if: always() && steps.deploy.outputs.had_existing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: show-os-ionos-backup-${{ github.run_id }}
          path: deploy-backup/index.html
          if-no-files-found: error
          retention-days: 30
