name: Validate SHOW OS CAMPUS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check main campus file exists
        run: test -s index.html

      - name: Extract and check inline application JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.find("<script>")
          end = html.find("</script>", start + 8)
          if start < 0 or end < 0:
              raise SystemExit("No inline application script was found")
          script = html[start + 8:end]
          Path("/tmp/show-os-inline.js").write_text(script, encoding="utf-8")
          print("Inline application script extracted.")
          PY
          node --check /tmp/show-os-inline.js

      - name: Check core campus sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="home"', 'id="day"', 'id="systems"', 'id="courses"',
              'id="sim"', 'id="cert"', 'id="profile"', 'premiumCourses',
              'courseSearch', 'courseGrid'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing campus elements: " + ", ".join(missing))
          print("Core sections and course catalogue markers are present.")
          PY
